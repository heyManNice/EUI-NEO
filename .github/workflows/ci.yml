name: ci

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        window: [glfw, sdl2]
        render: [opengl, vulkan]

    steps:
      - uses: actions/checkout@v5

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            libcurl4-openssl-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libsdl2-dev \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            ninja-build \
            xvfb

      - name: configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEUI_BUILD_APPS=OFF
          -DEUI_BUILD_USER_APPS=OFF
          -DEUI_BUILD_TEST_FIXTURES=ON
          -DEUI_ENABLE_INSTALL=ON
          -DEUI_WINDOW_BACKEND=${{ matrix.window }}
          -DEUI_RENDER_BACKEND=${{ matrix.render }}
          -DGLFW_BUILD_WAYLAND=OFF
          -DGLFW_BUILD_X11=ON

      - name: build
        run: cmake --build build-ci --parallel

      - name: unit tests
        run: ctest --test-dir build-ci -L unit --output-on-failure

      - name: backend probes
        run: xvfb-run -a ctest --test-dir build-ci -L probe --output-on-failure

      - name: install SDK
        run: cmake --install build-ci --prefix "$PWD/package-sdk"

      - name: verify installed package
        run: |
          cmake -S tests/consumers/find-package -B package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/package-sdk"
          cmake --build package-consumer --parallel
          ctest --test-dir package-consumer --output-on-failure

  devtools-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            libcurl4-openssl-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libsdl2-dev \
            libvulkan-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            ninja-build

      - name: configure
        run: >-
          cmake -S . -B build-devtools -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DEUI_BUILD_APPS=OFF
          -DEUI_BUILD_USER_APPS=OFF
          -DEUI_BUILD_TEST_FIXTURES=ON
          -DEUI_WINDOW_BACKEND=glfw
          -DEUI_RENDER_BACKEND=opengl
          -DGLFW_BUILD_WAYLAND=OFF
          -DGLFW_BUILD_X11=ON

      - name: build
        # Every test the step below runs, so a test target that stops building fails here
        # instead of quietly leaving the suite short.
        run: >-
          cmake --build build-devtools --parallel
          --target devtools_host devtools_fields devtools_tree devtools_preview devtools_viewer

      - name: devtools unit tests
        run: ctest --test-dir build-devtools -R "^devtools_" --output-on-failure --no-tests=error

      # The seam is a feature of its own, not a debug-build accident: a release build that
      # turns it on must build the panel and its tests, and a release build that leaves it
      # off must keep them out. Both are checked here so the promise cannot rot.
      - name: configure release with tooling
        run: >-
          cmake -S . -B build-devtools-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEUI_TOOLING=ON
          -DEUI_BUILD_APPS=OFF
          -DEUI_BUILD_USER_APPS=OFF
          -DEUI_BUILD_TEST_FIXTURES=ON
          -DEUI_WINDOW_BACKEND=glfw
          -DEUI_RENDER_BACKEND=opengl
          -DGLFW_BUILD_WAYLAND=OFF
          -DGLFW_BUILD_X11=ON

      - name: build release with tooling
        run: >-
          cmake --build build-devtools-release --parallel
          --target devtools_host devtools_fields devtools_tree devtools_preview

      - name: devtools unit tests in release
        run: ctest --test-dir build-devtools-release -R "^devtools_" --output-on-failure --no-tests=error

      - name: configure release without tooling
        run: >-
          cmake -S . -B build-no-tooling -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEUI_TOOLING=OFF
          -DEUI_BUILD_APPS=OFF
          -DEUI_BUILD_USER_APPS=OFF
          -DEUI_BUILD_TEST_FIXTURES=ON
          -DEUI_WINDOW_BACKEND=glfw
          -DEUI_RENDER_BACKEND=opengl
          -DGLFW_BUILD_WAYLAND=OFF
          -DGLFW_BUILD_X11=ON

      - name: build release without tooling
        # `available()` is the one thing a build without the seam answers, and it says no:
        # the module carries no panel code at all.
        run: |
          cmake --build build-no-tooling --parallel --target eui_neo_module_devtools
          for lib in build-no-tooling/lib*eui_neo*.a; do
            if nm --defined-only "$lib" | grep -qE 'DevtoolsHost|buildElementTree|ElementPatches|readElementValues'; then
              echo "a build without the tooling seam linked panel code: $lib"
              exit 1
            fi
          done
